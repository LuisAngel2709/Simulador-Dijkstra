<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de Dijkstra</title>
  <meta name="description" content="Simulador educativo interactivo del algoritmo de Dijkstra: construye un grafo y observa el camino mínimo paso a paso.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M8 22L16 10L24 22' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/estilos.css">
  <script>
    // Evita el parpadeo: aplica el tema guardado antes de pintar.
    try {
      var t = localStorage.getItem("dijkstra.tema");
      var oscuro = t ? t === "oscuro" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = oscuro ? "dark" : "light";
    } catch (e) {}
  </script>
</head>
<body>
  <div id="raiz"></div>
  <noscript>Este simulador necesita JavaScript.</noscript>
  <script type="module" src="src/ui/main.js"></script>
</body>
</html>
